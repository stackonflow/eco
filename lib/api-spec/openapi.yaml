openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: EcoCycle API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Account registration, login, profile, and session operations
  - name: waste
    description: Waste rates and pickup requests
  - name: admin
    description: Administrator management of rates and pickup requests
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Create a user, collector, or recycler account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid registration details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An account with this email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Sign in to an EcoCycle account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the signed-in account
      security:
        - AuthCookie: []
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/profile:
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Update the signed-in account profile
      security:
        - AuthCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid profile details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: End the signed-in session
      security:
        - AuthCookie: []
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
  /waste-rates:
    get:
      operationId: listActiveWasteRates
      tags: [waste]
      summary: List active waste rates for the signed-in user
      security:
        - AuthCookie: []
      responses:
        "200":
          description: Active rates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WasteRate"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /waste-requests:
    get:
      operationId: listMyWasteRequests
      tags: [waste]
      summary: List pickup requests belonging to the signed-in user
      security:
        - AuthCookie: []
      responses:
        "200":
          description: The user's pickup requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PickupRequest"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createWasteRequest
      tags: [waste]
      summary: Submit a pickup request using the current active rate
      security:
        - AuthCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupRequestInput"
      responses:
        "201":
          description: Pickup request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupRequest"
        "400":
          description: Invalid request details or inactive rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No active rate exists for the selected category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /waste-requests/{requestId}:
    get:
      operationId: getWasteRequest
      tags: [waste]
      summary: View an owned request or one accessible to an administrator
      security:
        - AuthCookie: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pickup request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupRequest"
        "403":
          description: This request belongs to another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pickup request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/waste-rates:
    get:
      operationId: listAllWasteRates
      tags: [admin]
      summary: List active and inactive rates
      security:
        - AuthCookie: []
      responses:
        "200":
          description: All rates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WasteRate"
    post:
      operationId: createWasteRate
      tags: [admin]
      summary: Create a waste rate
      security:
        - AuthCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WasteRateInput"
      responses:
        "201":
          description: Rate created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WasteRate"
        "409":
          description: A rate already exists for this category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/waste-rates/{rateId}:
    patch:
      operationId: updateWasteRate
      tags: [admin]
      summary: Update the price or active status of a rate
      security:
        - AuthCookie: []
      parameters:
        - name: rateId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WasteRateUpdate"
      responses:
        "200":
          description: Rate updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WasteRate"
        "404":
          description: Rate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/waste-requests:
    get:
      operationId: listAllWasteRequests
      tags: [admin]
      summary: List pickup requests for administration
      security:
        - AuthCookie: []
      responses:
        "200":
          description: All pickup requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PickupRequest"
  /admin/waste-requests/{requestId}:
    patch:
      operationId: updateWasteRequestStatus
      tags: [admin]
      summary: Update the status of a pickup request
      security:
        - AuthCookie: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupRequestStatusUpdate"
      responses:
        "200":
          description: Pickup request updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupRequest"
        "404":
          description: Pickup request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/collectors:
    get:
      operationId: listCollectors
      tags: [admin]
      summary: List authorized collector accounts for assignment
      security:
        - AuthCookie: []
      responses:
        "200":
          description: Collector accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CollectorSummary"
  /admin/waste-requests/{requestId}/assignment:
    patch:
      operationId: assignCollector
      tags: [admin]
      summary: Assign an authorized collector to a pickup request
      security:
        - AuthCookie: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectorAssignmentInput"
      responses:
        "200":
          description: Assigned pickup request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupRequest"
  /admin/waste-requests/{requestId}/schedule:
    patch:
      operationId: schedulePickup
      tags: [admin]
      summary: Schedule or reschedule an assigned pickup
      security:
        - AuthCookie: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupScheduleInput"
      responses:
        "200":
          description: Scheduled pickup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupRequest"
  /collector/assignments:
    get:
      operationId: listCollectorAssignments
      tags: [collector]
      summary: List pickup requests assigned to the signed-in collector
      security:
        - AuthCookie: []
      responses:
        "200":
          description: Assigned pickup requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PickupRequest"
  /collector/waste-requests/{requestId}/status:
    patch:
      operationId: updateCollectorPickupStatus
      tags: [collector]
      summary: Record collection of a pickup assigned to the collector
      security:
        - AuthCookie: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectorStatusInput"
      responses:
        "200":
          description: Updated pickup request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupRequest"
  /collector/waste-requests/{requestId}/verification:
    post:
      operationId: verifyCollection
      tags: [collector]
      summary: Record verified weight and quality and create the receipt and inventory batch
      security:
        - AuthCookie: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionVerificationInput"
      responses:
        "201":
          description: Verified collection with receipt and inventory batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationResult"
  /receipts:
    get:
      operationId: listMyReceipts
      tags: [waste]
      summary: List digital receipts belonging to the signed-in user
      security:
        - AuthCookie: []
      responses:
        "200":
          description: User receipts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Receipt"
  /receipts/{receiptId}:
    get:
      operationId: getReceipt
      tags: [waste]
      summary: View an owned receipt or one accessible to an administrator
      security:
        - AuthCookie: []
      parameters:
        - name: receiptId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Digital receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
  /admin/receipts:
    get:
      operationId: listAllReceipts
      tags: [admin]
      summary: List digital receipts for operational use
      security:
        - AuthCookie: []
      responses:
        "200":
          description: All receipts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Receipt"
  /admin/inventory:
    get:
      operationId: listInventoryBatches
      tags: [admin]
      summary: List verified material inventory batches
      security:
        - AuthCookie: []
      responses:
        "200":
          description: Inventory batches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryBatch"
  /admin/inventory/{batchId}:
    get:
      operationId: getInventoryBatch
      tags: [admin]
      summary: Retrieve an inventory batch
      security:
        - AuthCookie: []
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Inventory batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryBatch"
  /admin/inventory/qr/{token}:
    get:
      operationId: getInventoryBatchByQr
      tags: [admin]
      summary: Resolve an authorized inventory QR code
      security:
        - AuthCookie: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Inventory batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryBatch"
  /admin/inventory/{batchId}/processing:
    patch:
      operationId: updateInventoryProcessing
      tags: [admin]
      summary: Update the processing status or storage location of a batch
      security:
        - AuthCookie: []
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryProcessingInput"
      responses:
        "200":
          description: Updated inventory batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryBatch"
components:
  securitySchemes:
    AuthCookie:
      type: apiKey
      in: cookie
      name: ecocycle_token
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    UserRole:
      type: string
      enum: [user, collector, recycler, admin]
    SignupRole:
      type: string
      enum: [user, collector, recycler]
    UserProfile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, name, email, role, phone, address, createdAt]
    RegisterInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        role:
          $ref: "#/components/schemas/SignupRole"
      required: [name, email, password, role]
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128
      required: [email, password]
    ProfileUpdateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        phone:
          type: ["string", "null"]
          maxLength: 32
        address:
          type: ["string", "null"]
          maxLength: 300
    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        user:
          $ref: "#/components/schemas/UserProfile"
      required: [success, user]
    LogoutResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    WasteCategory:
      type: string
      enum: [Plastic, Paper, Cardboard, Metal, Glass, E-waste, Organic waste]
    WasteRate:
      type: object
      properties:
        id:
          type: string
        category:
          $ref: "#/components/schemas/WasteCategory"
        ratePerKg:
          type: number
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, category, ratePerKg, active, createdAt, updatedAt]
    WasteRateInput:
      type: object
      properties:
        category:
          $ref: "#/components/schemas/WasteCategory"
        ratePerKg:
          type: number
          exclusiveMinimum: 0
          maximum: 1000000
      required: [category, ratePerKg]
    WasteRateUpdate:
      type: object
      properties:
        ratePerKg:
          type: number
          exclusiveMinimum: 0
          maximum: 1000000
        active:
          type: boolean
    PickupRequestInput:
      type: object
      properties:
        category:
          $ref: "#/components/schemas/WasteCategory"
        estimatedQuantityKg:
          type: number
          exclusiveMinimum: 0
          maximum: 1000
        pickupAddress:
          type: string
          minLength: 5
          maxLength: 500
        preferredPickupAt:
          type: string
          format: date-time
        description:
          type: string
          maxLength: 1000
      required: [category, estimatedQuantityKg, pickupAddress, preferredPickupAt]
    PickupRequestStatus:
      type: string
      enum: [pending, accepted, scheduled, collected, verified, completed, cancelled, rejected]
    PickupRequestStatusUpdate:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/PickupRequestStatus"
      required: [status]
    PickupRequest:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        userName:
          type: ["string", "null"]
        userEmail:
          type: ["string", "null"]
        category:
          $ref: "#/components/schemas/WasteCategory"
        estimatedQuantityKg:
          type: number
        pickupAddress:
          type: string
        preferredPickupAt:
          type: string
          format: date-time
        description:
          type: ["string", "null"]
        ratePerKg:
          type: number
        estimatedValue:
          type: number
        status:
          $ref: "#/components/schemas/PickupRequestStatus"
        assignedCollector:
          anyOf:
            - $ref: "#/components/schemas/CollectorSummary"
            - type: "null"
        scheduledAt:
          type: ["string", "null"]
          format: date-time
        statusHistory:
          type: array
          items:
            $ref: "#/components/schemas/StatusHistoryEntry"
        verification:
          anyOf:
            - $ref: "#/components/schemas/CollectionVerification"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - userName
        - userEmail
        - category
        - estimatedQuantityKg
        - pickupAddress
        - preferredPickupAt
        - description
        - ratePerKg
        - estimatedValue
        - status
        - assignedCollector
        - scheduledAt
        - statusHistory
        - verification
        - createdAt
        - updatedAt
    CollectorSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
      required: [id, name, email]
    StatusHistoryEntry:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/PickupRequestStatus"
        note:
          type: ["string", "null"]
        actorName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [status, note, actorName, createdAt]
    CollectorAssignmentInput:
      type: object
      properties:
        collectorId:
          type: string
          minLength: 1
      required: [collectorId]
    PickupScheduleInput:
      type: object
      properties:
        scheduledAt:
          type: string
          format: date-time
      required: [scheduledAt]
    CollectorStatusInput:
      type: object
      properties:
        status:
          type: string
          enum: [collected]
      required: [status]
    CollectionQuality:
      type: string
      enum: [excellent, good, fair, poor]
    CollectionVerificationInput:
      type: object
      properties:
        actualWeightKg:
          type: number
          exclusiveMinimum: 0
          maximum: 100000
        quality:
          $ref: "#/components/schemas/CollectionQuality"
        ratePerKg:
          type: number
          exclusiveMinimum: 0
          maximum: 1000000
        notes:
          type: string
          maxLength: 2000
      required: [actualWeightKg, quality, ratePerKg]
    CollectionVerification:
      type: object
      properties:
        actualWeightKg:
          type: number
        quality:
          $ref: "#/components/schemas/CollectionQuality"
        ratePerKg:
          type: number
        finalAmount:
          type: number
        notes:
          type: ["string", "null"]
        collectorName:
          type: ["string", "null"]
        verifiedAt:
          type: string
          format: date-time
      required: [actualWeightKg, quality, ratePerKg, finalAmount, notes, collectorName, verifiedAt]
    Receipt:
      type: object
      properties:
        id:
          type: string
        receiptNumber:
          type: string
        pickupRequestId:
          type: string
        userName:
          type: string
        userEmail:
          type: string
          format: email
        category:
          $ref: "#/components/schemas/WasteCategory"
        estimatedQuantityKg:
          type: number
        estimatedRatePerKg:
          type: number
        estimatedValue:
          type: number
        actualWeightKg:
          type: number
        finalRatePerKg:
          type: number
        finalAmount:
          type: number
        collectionDate:
          type: string
          format: date-time
        verificationDate:
          type: string
          format: date-time
        paymentStatus:
          type: string
          enum: [pending]
        createdAt:
          type: string
          format: date-time
      required: [id, receiptNumber, pickupRequestId, userName, userEmail, category, estimatedQuantityKg, estimatedRatePerKg, estimatedValue, actualWeightKg, finalRatePerKg, finalAmount, collectionDate, verificationDate, paymentStatus, createdAt]
    VerificationResult:
      type: object
      properties:
        request:
          $ref: "#/components/schemas/PickupRequest"
        receipt:
          $ref: "#/components/schemas/Receipt"
        batch:
          $ref: "#/components/schemas/InventoryBatch"
      required: [request, receipt, batch]
    InventoryProcessingStatus:
      type: string
      enum: [collected, sorted, stored, sent_for_processing, processed]
    InventoryBatch:
      type: object
      properties:
        id:
          type: string
        batchCode:
          type: string
        category:
          $ref: "#/components/schemas/WasteCategory"
        verifiedQuantityKg:
          type: number
        availableQuantityKg:
          type: number
        reservedQuantityKg:
          type: number
        quality:
          $ref: "#/components/schemas/CollectionQuality"
        pickupRequestId:
          type: string
        collectionDate:
          type: string
          format: date-time
        processingStatus:
          $ref: "#/components/schemas/InventoryProcessingStatus"
        storageLocation:
          type: ["string", "null"]
        qrToken:
          type: string
        qrUrl:
          type: string
        statusHistory:
          type: array
          items:
